<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Victorpetruccio.online</title>
</head>

<body>
  <div id="debug-layer" style="position:fixed;z-index:99999;pointer-events:none;"></div>
  <script>
    window.onerror = function (msg, url, line, col, error) {
      var d = document.createElement("div");
      d.style.cssText = "background:red;color:white;padding:10px;margin:5px;pointer-events:auto;font-family:monospace;border:2px solid white;";
      d.innerText = "CRITICAL JS ERROR: " + msg + " (" + url + ":" + line + ")\n" + (error ? error.stack : "");
      document.body.appendChild(d);
    };
    window.addEventListener('unhandledrejection', function (event) {
      var d = document.createElement("div");
      d.style.cssText = "background:orange;color:black;padding:10px;margin:5px;pointer-events:auto;font-family:monospace;border:2px solid black;";
      d.innerText = "UNHANDLED PROMISE: " + event.reason;
      document.body.appendChild(d);
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
