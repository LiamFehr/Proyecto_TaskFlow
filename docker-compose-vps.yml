services:
  postgres:
    image: postgres:16
    container_name: taskflow-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${TF_DB_NAME:-taskflow}
      - POSTGRES_USER=${TF_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${TF_DB_PASSWORD:-taskflow_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    networks:
      - taskflow-network
    restart: always

  agente:
    image: taskflow-agente:v1.0
    container_name: taskflow-agente
    ports:
      - "8001:8001"
    environment:
      - TASKFLOW_ADMIN_EMAIL=${TF_ADMIN_EMAIL:-admin@taskflow.com}
      - TASKFLOW_ADMIN_PASS=${TF_ADMIN_PASS:-admin123}
      - GROQ_API_KEY=${TF_GROQ_API_KEY}
    volumes:
      - agente_uploads:/app/uploads
    networks:
      - taskflow-network
    restart: always
    depends_on:
      - backend

  backend:
    image: taskflow-app-backend:v5.24
    container_name: taskflow-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AI_AGENT_URL=http://taskflow-agente:8001
      - REDIS_HOST=redis
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${TF_DB_NAME:-taskflow}
      - SPRING_DATASOURCE_USERNAME=${TF_DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${TF_DB_PASSWORD:-taskflow_pass}
    depends_on:
      - postgres
      - redis
    networks:
      - taskflow-network
    restart: always

  frontend:
    image: taskflow-app-frontend:v5.27
    container_name: taskflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskflow-network
    restart: always

volumes:
  postgres_data:
    external: true
    name: taskflow-deploy_postgres_data
  redis_data:
  agente_uploads:

networks:
  taskflow-network:
    driver: bridge
