version: '3.8'

services:

  # ── Base de datos ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: taskflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Spring Boot (VPS Relay) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prebuilt   # requiere app.jar compilado en backend/
    container_name: taskflow_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Override de la URL de la DB para apuntar al contenedor (no localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/taskflow
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Tokens relay (ERP escritorio ↔ VPS)
      RELAY_WS_AUTH_TOKEN: ${RELAY_TOKEN}
      RELAY_API_AUTH_TOKEN: ${RELAY_TOKEN}
      # Auth JWT
      APP_JWT_SECRET: ${JWT_SECRET}
      # Google OAuth (opcional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # URL pública del frontend
      APP_FRONTEND_URL: https://${DOMAIN}
      APP_BASE_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # ── Frontend React (web app del cliente) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: taskflow_frontend
    restart: unless-stopped
    networks:
      - app_network

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: taskflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificados Let's Encrypt (generados en el servidor con certbot)
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

volumes:
  postgres_data:
  certbot_www:

networks:
  app_network:
    driver: bridge
