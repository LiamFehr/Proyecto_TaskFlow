# ==============================================
# TASKFLOW 2.0 - PRODUCCIÓN
# ==============================================

# Server
server.port=${TF_BACKEND_PORT:8000}

# Database
spring.datasource.url=jdbc:postgresql://localhost:${TF_DB_PORT:5432}/${TF_DB_NAME:taskflow}
spring.datasource.username=${TF_DB_USER}
spring.datasource.password=${TF_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Logging (mínimo en producción)
logging.level.root=WARN
logging.level.com.taskflow=INFO
logging.level.org.springframework.web=WARN

# Jackson
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator (solo health en prod)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Security
server.error.include-message=never
server.error.include-stacktrace=never
