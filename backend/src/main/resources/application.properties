spring.profiles.active=dev
spring.application.name=backend
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.proyecto=DEBUG

taskflow.pedidos.root=C:/taskflow/pedidos
taskflow.pedidos.pendientes=${taskflow.pedidos.root}/pendientes

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── Relay ERP (mismo token para WS y REST) ───────────────────────────────────
relay.ws.auth-token=${RELAY_TOKEN}
relay.api.auth-token=${RELAY_TOKEN}
