# ==============================================
# TASKFLOW 2.0 - DESARROLLO
# ==============================================

# Server
server.port=${TF_BACKEND_PORT:8000}

# Database
spring.datasource.url=jdbc:postgresql://localhost:${TF_DB_PORT:5433}/${TF_DB_NAME:taskflow_dev}
spring.datasource.username=${TF_DB_USER:taskflow_dev}
spring.datasource.password=${TF_DB_PASSWORD:dev_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${TF_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Logging (verbose en desarrollo)
logging.level.root=INFO
logging.level.com.taskflow=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator (habilitado en dev)
management.endpoints.web.exposure.include=health,info,metrics,flyway
management.endpoint.health.show-details=always
